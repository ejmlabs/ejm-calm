version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      compatible-updates:
        update-types: [minor, patch]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    ignore:
      # The ejmlabs/.github caller pins move only by hand, in one pull request with the synced files of that commit.
      - dependency-name: "ejmlabs/.github*"
