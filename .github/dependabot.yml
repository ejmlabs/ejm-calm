version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      compatible-updates:
        update-types: [minor, patch]
    ignore:
      # The shared strict lint layer (eslint.strict.mjs) names these exact versions; they move with it, in the pull
      # request that resyncs the layer from ejmlabs/.github, never on their own.
      - dependency-name: "eslint"
      - dependency-name: "@eslint/js"
      - dependency-name: "typescript-eslint"
      - dependency-name: "typescript"
      - dependency-name: "@tsconfig/strictest"
      - dependency-name: "globals"
      - dependency-name: "@eslint-community/eslint-plugin-eslint-comments"
      # calm runs on Node 24 only (engines): its types follow that major.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    ignore:
      # The ejmlabs/.github caller pins move only by hand, in one pull request with the synced files of that commit.
      - dependency-name: "ejmlabs/.github*"
